<!DOCTYPE html>
<html lang="en">
<head>
    <title>LogIn Page</title>
        <link rel="stylesheet" href="logIn.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="box">
        <div class="left">
            <img class="nature-img" src="/Login icons/nature.jpg">
        </div>
            <form class="right">
                <h4 class="login-header">Login to your account</h4>
                    <div class="btn">
                        <button class="google-btn">
                            <img class="google-img" src="/Login icons/icons8-google-50.png">
                                        <p class="p1">Login with <span class="a">Google</span></p>
                        </button>
                    <div class="btn">
                        <button class="facebook-btn">
                            <img class="facebook-img" src="/Login icons/icons8-facebook-50.png">
                                        <p class="p1"><span class="a">Login with </span>Facebook</p>
                        </button>
                    </div>
                </div>
                    <span class="Or">Or</span>
                        <input class="email" type="email" placeholder="Email">
                        <input class="password" type="password" placeholder="Password">
                        <button class="submit">Login</button>
            </form>
        </div>
    </body>
</html>
